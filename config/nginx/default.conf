server {
    listen       8080 default_server;
    listen  [::]:8080 default_server;
    server_name  _;

    root   /var/www/html;
    index  index.php index.html;

    client_max_body_size 256M;

    # Long-running uploads / restores must be allowed past the default 60s.
    # The OpenShift Route timeout in Phase 4 is raised in lockstep with this value
    # to fix the silent restore failures called out in the 2026-04-12 restore assessment.
    fastcgi_read_timeout  900s;
    fastcgi_send_timeout  900s;
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;

    # Moodle-recommended deny rules
    location ~ ^/(\.|composer\.|config\.|install\.xml|environment\.xml|README|LICENSE) {
        deny all;
    }
    location ~ /\.git { deny all; }
    location ~ /(vendor|node_modules)/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info  ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }

        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;
        include        fastcgi_params;

        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 64k;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
