# Real client IP + audit-grade access log (BC Gov logging guidance, LOG-05).
# The only ingress path is the OpenShift router (enforced by NetworkPolicy), which
# adds X-Forwarded-For. Without realip, $remote_addr is just the router pod IP, so
# access/audit logs can't attribute a request to a learner (e.g. tracing a brute
# force). log_format must live in http context, and this file is included inside
# nginx's http{}, so it's defined here.
log_format main_xff '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'xff="$http_x_forwarded_for"';

server {
    listen       8080 default_server;
    listen  [::]:8080 default_server;
    server_name  _;

    # Recover the real client IP from X-Forwarded-For. Trust only in-cluster
    # (RFC1918) hops — the router lives in the pod network — so a spoofed XFF from
    # a hypothetical direct client is ignored. real_ip_recursive walks the chain
    # past trusted hops to the left-most untrusted address (the learner).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    access_log /dev/stdout main_xff;

    root   /var/www/html;
    index  index.php index.html;

    client_max_body_size 256M;

    # Long-running uploads / restores must be allowed past the default 60s.
    # The OpenShift Route timeout in Phase 4 is raised in lockstep with this value
    # to fix the silent restore failures called out in the 2026-04-12 restore assessment.
    fastcgi_read_timeout  900s;
    fastcgi_send_timeout  900s;
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;

    # Moodle-recommended deny rules
    location ~ ^/(\.|composer\.|config\.|install\.xml|environment\.xml|README|LICENSE) {
        deny all;
    }
    location ~ /\.git { deny all; }
    location ~ /(vendor|node_modules)/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info  ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }

        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;
        include        fastcgi_params;

        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 64k;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
