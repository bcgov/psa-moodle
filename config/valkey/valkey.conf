# Minimal Valkey config for local dev.
# Valkey is the Linux Foundation fork of Redis 7.2; protocol-compatible.
# OpenShift values land in a ConfigMap rendered by the Helm chart.

bind 0.0.0.0 -::*
protected-mode no
port 6379

# Persistence: lightweight RDB only. Moodle uses Valkey for sessions + cache;
# losing in-flight state on restart is acceptable.
save 60 1000
appendonly no
dir /data

# Memory cap for local dev; OpenShift sizes via Helm values.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""
