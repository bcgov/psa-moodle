; Moodle-tuned php.ini overlay.
; Loaded as /usr/local/etc/php/conf.d/moodle-php.ini (highest precedence).

; --- Resource limits ---
; 2048M, as legacy (moodle-nginx config/php/php.ini): Moodle's backup and restore raise only to MEMORY_EXTRA
; (extramemorylimit, 512M by default), so a large .mbz restore that works on legacy would fail at 512M (self-review
; V1303). Most requests use a small fraction; the pods' memory limits (chart values) are sized for the pool.
memory_limit = 2048M
max_execution_time = 900
max_input_time = 900
max_input_vars = 5000
post_max_size = 256M
upload_max_filesize = 256M
default_socket_timeout = 900

; --- Don't advertise the PHP version (no X-Powered-By header). php.ini-production leaves this On.
expose_php = Off

; --- Errors / logging ---
; Production-safe defaults; override locally via compose env if needed for dev.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; --- Sessions: handled by Moodle's redis driver, not PHP's session.save_handler.
; Leave PHP session settings at defaults.

; --- Timezone ---
date.timezone = America/Vancouver

; --- Opcache (matters for Moodle performance) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; The code is immutable (in the image), so it is never re-checked. moodledata holds PHP files Moodle rewrites while
; running: muc/config.php (the cache mapping) and lang/*_local/ (language customisations). Never cache those, or a
; change made on one pod, or by the CLI, never reaches the others until they restart (self-review V1316).
opcache.blacklist_filename = /usr/local/etc/php/opcache-blacklist.txt
opcache.save_comments = 1
opcache.fast_shutdown = 1

; --- Realpath cache ---
realpath_cache_size = 4096k
realpath_cache_ttl = 600
