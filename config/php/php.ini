; Moodle-tuned php.ini overlay.
; Loaded as /usr/local/etc/php/conf.d/moodle-php.ini (highest precedence).

; --- Resource limits ---
memory_limit = 512M
max_execution_time = 900
max_input_time = 900
max_input_vars = 5000
post_max_size = 256M
upload_max_filesize = 256M
default_socket_timeout = 900

; --- Errors / logging ---
; Production-safe defaults; override locally via compose env if needed for dev.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; --- Sessions: handled by Moodle's redis driver, not PHP's session.save_handler.
; Leave PHP session settings at defaults.

; --- Timezone ---
date.timezone = America/Vancouver

; --- Opcache (matters for Moodle performance) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; --- Realpath cache ---
realpath_cache_size = 4096k
realpath_cache_ttl = 600
