; Pool MUST be named [www] — the base image ships docker.conf and zz-docker.conf
; which both add settings to [www], not whatever we name our pool. A different
; name produces two separate pools and FPM fails with "process manager missing".
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

; Process management — modest defaults suitable for local dev.
; OpenShift values get overridden via Helm values + env at runtime.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Status endpoint for php-fpm-healthcheck
pm.status_path = /status
ping.path = /ping
ping.response = pong

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null
