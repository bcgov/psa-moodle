# Build container images.
#
# On PR: build both variants to verify Containerfiles + Moodle clone succeed.
#        Do NOT push (PR images aren't useful to anyone outside the build).
# On main: build + push both variants to Artifactory, tagged with the git SHA.
#
# Reuses the Makefile targets `make build` and `make push` so local + CI run
# the exact same commands.

name: build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}    # allows scheduled-rebuild.yml (and manual re-runs) to trigger

permissions:
  contents: read

env:
  REGISTRY: artifacts.developer.gov.bc.ca
  REGISTRY_REPO: a58ce1-tools/psa-moodle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          # Short git SHA — same tag is reused for the openshift and -local variants.
          echo "image_tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Podman is preinstalled on ubuntu-latest; no setup-podman needed.
      - name: Podman version
        run: podman version

      # Secrets can't be referenced directly in `if:` conditions, so detect the
      # Artifactory credential here and gate the push steps on the output.
      # Until the `a58ce1-tools` Artifactory repo is provisioned (see
      # docs/next-steps.md) the secret is unset, and main builds verify-only
      # instead of failing. The push path self-enables once the secret is added.
      - name: Detect registry credentials
        id: creds
        env:
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          if [ -n "$ARTIFACTORY_PASSWORD" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ARTIFACTORY_PASSWORD not set — building without pushing. Provision a58ce1-tools and add the secret to enable push (see docs/next-steps.md)."
          fi

      # Build-only when this is a PR, or when we have nowhere to push to yet.
      - name: Build (verify only, no push)
        if: github.event_name == 'pull_request' || steps.creds.outputs.have != 'true'
        run: |
          # Build both variants; same as `make push` minus the push step.
          make build MOODLE_CONFIG_VARIANT=local    TAG=${{ steps.tag.outputs.image_tag }}-local
          make build MOODLE_CONFIG_VARIANT=openshift TAG=${{ steps.tag.outputs.image_tag }}

      - name: Log in to Artifactory
        if: github.event_name != 'pull_request' && steps.creds.outputs.have == 'true'
        run: |
          echo "${{ secrets.ARTIFACTORY_PASSWORD }}" | \
            podman login "$REGISTRY" \
              --username "${{ secrets.ARTIFACTORY_USERNAME }}" \
              --password-stdin

      - name: Build + push (main / dispatch)
        if: github.event_name != 'pull_request' && steps.creds.outputs.have == 'true'
        run: |
          make push VERSION=${{ steps.tag.outputs.image_tag }}

      - name: Summary
        run: |
          {
            echo "## build summary"
            echo
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- sha: \`${GITHUB_SHA}\`"
            echo "- image tag: \`${{ steps.tag.outputs.image_tag }}\`"
            if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ steps.creds.outputs.have }}" = "true" ]; then
              echo "- pushed to: \`$REGISTRY/$REGISTRY_REPO/{php,web,cron}:${{ steps.tag.outputs.image_tag }}\` (openshift variant)"
              echo "- also pushed: \`...${{ steps.tag.outputs.image_tag }}-local\` (local variant for smoke testing)"
            elif [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- mode: build verification (no push — Artifactory credential not set; see docs/next-steps.md)"
            else
              echo "- mode: PR build verification (no push)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
