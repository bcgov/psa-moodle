# Fast PR feedback: lint everything that doesn't require building or deploying.
#
# Runs in parallel with build.yml so a PR can fail fast on chart/scripts issues
# without waiting for the (~5 min) container build.

name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.14.3
      - name: helm lint (default values)
        run: helm lint chart/psa-moodle
      - name: helm lint (values-dev)
        run: helm lint chart/psa-moodle -f chart/psa-moodle/values-dev.yaml
      - name: helm lint (values-test)
        run: helm lint chart/psa-moodle -f chart/psa-moodle/values-test.yaml
      - name: helm template (values-dev) — must render without errors
        run: |
          helm template psa-moodle chart/psa-moodle \
            -n a58ce1-dev \
            -f chart/psa-moodle/values-dev.yaml \
            --set image.tag=ci > /tmp/rendered-dev.yaml
          grep -c '^kind:' /tmp/rendered-dev.yaml
      - name: helm template (values-test)
        run: |
          helm template psa-moodle chart/psa-moodle \
            -n a58ce1-test \
            -f chart/psa-moodle/values-test.yaml \
            --set image.tag=ci > /tmp/rendered-test.yaml
      - name: pgBackRest schedules never share a minute (Pass B run 2, the 01:00 lock collision)
        run: |
          d=sha256:$(printf '0%.0s' $(seq 64))
          for e in dev test prod; do
            out=$(helm template t chart/psa-moodle -f "chart/psa-moodle/values-950003-$e.yaml" --set backup.alerts.to=ci@example.invalid \
                    --set php.image.digest="$d" --set web.image.digest="$d" --set cron.image.digest="$d")
            minute() { awk -v k="$1:" '$1 == k {gsub(/"/, "", $2); print $2; exit}' <<< "$out"; }
            inc=$(minute incremental); full=$(minute full); diff=$(minute differential)
            echo "$e: incremental minute $inc, full $full, differential ${diff:-none}"
            if [ -z "$inc" ] || [ "$inc" = "$full" ] || [ "$inc" = "${diff:-x}" ]; then
              echo "::error::$e: the incremental shares a minute with the full or differential backup"; exit 1
            fi
          done

      - name: Egress per component, 950003 profiles (C9, C15, review V1003)
        run: |
          d=sha256:$(printf '0%.0s' $(seq 64))
          for e in dev test prod; do
            base=(-f "chart/psa-moodle/values-950003-$e.yaml" --set backup.alerts.to=ci@example.invalid
                  --set php.image.digest="$d" --set web.image.digest="$d" --set cron.image.digest="$d")
            echo "== $e precommit"; scripts/chart-egress-matrix.sh --expect precommit -- "${base[@]}" --set moodle.outbound=off --set networkPolicy.externalEgress=off
            echo "== $e review"; scripts/chart-egress-matrix.sh --expect review -- "${base[@]}" --set moodle.outbound=off --set networkPolicy.externalEgress=on --set cron.enabled=false
            echo "== $e commit"; scripts/chart-egress-matrix.sh --expect commit -- "${base[@]}" --set moodle.outbound=on --set networkPolicy.externalEgress=on
          done
      - name: 950003 images all through Artifactory (m950-learning, or its Docker Hub cache docker-remote), by digest (C13)
        run: |
          d=sha256:$(printf '0%.0s' $(seq 64))
          for e in dev test prod; do
            bad=$(helm template t chart/psa-moodle -f "chart/psa-moodle/values-950003-$e.yaml" --set backup.alerts.to=ci@example.invalid \
                    --set php.image.digest="$d" --set web.image.digest="$d" --set cron.image.digest="$d" --set image.ops.digest="$d" \
                  | grep -E '^\s+image: ' | grep -vE 'artifacts\.developer\.gov\.bc\.ca/(m950-learning|docker-remote)/.*@sha256:[0-9a-f]{64}' || true)
            [ -z "$bad" ] || { echo "::error::$e renders images not through Artifactory by digest:"; echo "$bad"; exit 1; }
            echo "$e: every image through Artifactory, by digest"
          done

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        # shellcheck is preinstalled on ubuntu-latest.
        run: |
          shopt -s globstar nullglob
          shellcheck --severity=warning scripts/**/*.sh ops/**/*.sh

  versions:
    # Every PHP base image must be the same release (php-fpm, cron, conversion), so a bump can't half-land.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: One PHP version across the Containerfiles
        run: |
          versions=$(grep -hoE 'library/php:[0-9]+\.[0-9]+\.[0-9]+' Containerfile* ops/replatform/Containerfile* | sort -u)
          echo "$versions"
          [ "$(echo "$versions" | wc -l)" -eq 1 ] || { echo "::error::PHP base images disagree"; exit 1; }

  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        # yamllint is preinstalled on ubuntu-latest.
        # chart/psa-moodle/templates/ holds Helm Go-templates ({{- ... }}), which
        # are not valid YAML — they're validated by `helm lint`/`helm template` in
        # the `helm` job above, so exclude them here.
        run: |
          yamllint \
            -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable, comments: disable}, ignore: 'chart/psa-moodle/templates/'}" \
            .github chart compose.yaml compose.registry.yaml
