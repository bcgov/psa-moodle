# deploy-950003 — the replatform's ONLY deploy path into a 950003 namespace (runbook C13, S7, S11, S13, S15).
#
# Run by hand. Each target is a GitHub environment (950003-dev, 950003-test, 950003-prod) that must have required
# reviewers; the job waits for one before it touches the cluster. Nothing triggers it automatically, it never runs
# upgrade.php, it deploys images by digest only (from build-exact), and it refuses unless the target database's Moodle
# version equals the image's code (Moodle's own `upgrade.php --is-pending`, run from the new php image).
#
# Profiles (every other value comes from chart/psa-moodle/values-950003-<env>.yaml):
#   precommit  outbound off, cron off, nightly backup off      (§13 before the commit point; review on the restricted Route)
#   commit     outbound on, cron on, nightly backup on          (S11: the commit point; recorded in the window log FIRST)
#   fenced     migration.state=fenced                            (S13 writer fence; verify-fenced.sh must pass)
#
# Per-environment settings, never in the repository (S9, S15): environment secrets OPENSHIFT_SERVER and OPENSHIFT_TOKEN;
# environment variables NAMESPACE, ROUTE_ALLOWED_SOURCES (JSON list of CIDRs), ALERT_TO, REVIEWER_ADMINS and, for fenced,
# FENCE_SERVICE.
name: deploy-950003

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target (a GitHub environment with required reviewers)
        required: true
        type: choice
        options: [950003-dev, 950003-test, 950003-prod]
      profile:
        description: precommit | commit (S11, record it first) | fenced (S13)
        required: true
        type: choice
        options: [precommit, commit, fenced]
      php_digest:
        description: php image digest (sha256:...) from build-exact
        required: true
      web_digest:
        description: web image digest (sha256:...) from build-exact
        required: true
      cron_digest:
        description: cron image digest (sha256:...) from build-exact
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      ENV_SHORT: ${{ inputs.environment == '950003-prod' && 'prod' || inputs.environment == '950003-test' && 'test' || 'dev' }}
      NS: ${{ vars.NAMESPACE }}
      RELEASE: psa-moodle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check inputs and settings
        run: |
          case "$NS" in 950003-*) ;; *) echo "::error::environment variable NAMESPACE must be a 950003 namespace"; exit 1 ;; esac
          [ "$NS" = "${{ inputs.environment }}" ] || { echo "::error::NAMESPACE $NS does not match ${{ inputs.environment }}"; exit 1; }
          for d in "${{ inputs.php_digest }}" "${{ inputs.web_digest }}" "${{ inputs.cron_digest }}"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not an image digest: $d"; exit 1; }
          done
          [ -n "${{ vars.ALERT_TO }}" ] || { echo "::error::environment variable ALERT_TO is not set"; exit 1; }
          if [ "${{ inputs.profile }}" = fenced ] && [ -z "${{ vars.FENCE_SERVICE }}" ]; then
            echo "::error::fenced needs the environment variable FENCE_SERVICE"; exit 1
          fi

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ vars.NAMESPACE }}

      - name: Render values for this run
        id: values
        run: |
          case "${{ inputs.profile }}" in
            precommit) prof=(--set moodle.outbound=off --set cron.enabled=false --set backup.moodledata.enabled=false --set migration.state=normal) ;;
            commit)    prof=(--set moodle.outbound=on --set cron.enabled=true --set backup.moodledata.enabled=true --set migration.state=normal) ;;
            fenced)    prof=(--set migration.state=fenced --set migration.fenceService="${{ vars.FENCE_SERVICE }}") ;;
          esac
          {
            printf '%s\n' -f "chart/psa-moodle/values-950003-$ENV_SHORT.yaml"
            printf '%s\n' --set "php.image.digest=${{ inputs.php_digest }}" --set "web.image.digest=${{ inputs.web_digest }}"
            printf '%s\n' --set "cron.image.digest=${{ inputs.cron_digest }}" --set "backup.alerts.to=${{ vars.ALERT_TO }}"
            printf '%s\n' --set-json "route.allowedSources=${{ vars.ROUTE_ALLOWED_SOURCES || '[]' }}"
            [ -n "${{ vars.REVIEWER_ADMINS }}" ] && printf '%s\n' --set "moodle.reviewerAdmins=${{ vars.REVIEWER_ADMINS }}"
            printf '%s\n' "${prof[@]}"
          } > /tmp/helm-args
          mapfile -t args < /tmp/helm-args          # one argument per line, so values may contain spaces
          helm lint chart/psa-moodle "${args[@]}"
          helm template "$RELEASE" chart/psa-moodle -n "$NS" "${args[@]}" > /tmp/rendered.yaml
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) objects"

      - name: Version check (S7) — the database must already be at the image's version
        if: inputs.profile != 'fenced'
        run: |
          php='select(.kind == "Deployment" and .metadata.labels."app.kubernetes.io/component" == "php")'
          image=$(yq -r "$php | .spec.template.spec.containers[0].image" /tmp/rendered.yaml)
          pull=$(yq -r "$php | .spec.template.spec.imagePullSecrets[0].name // \"\"" /tmp/rendered.yaml)
          secret=$(yq -r "$php | .spec.template.spec.containers[0].env[] | select(.name == \"DB_HOST\") | .valueFrom.secretKeyRef.name" /tmp/rendered.yaml)
          oc get secret "$secret" -n "$NS" >/dev/null 2>&1 \
            || { echo "::error::database secret $secret not found: load the database before deploying (§13.2)"; exit 1; }
          overrides=$(jq -n --arg img "$image" --arg s "$secret" --arg pull "$pull" '{spec: {restartPolicy: "Never",
            imagePullSecrets: (if $pull == "" then [] else [{name: $pull}] end),
            volumes: [{name: "data", emptyDir: {}}, {name: "cache", emptyDir: {}}],
            containers: [{name: "version-check", image: $img,
              command: ["php", "/var/www/html/admin/cli/upgrade.php", "--is-pending"],
              env: ([["DB_HOST","host"],["DB_PORT","port"],["DB_NAME","dbname"],["DB_USER","user"],["DB_PASSWORD","password"]]
                    | map({name: .[0], valueFrom: {secretKeyRef: {name: $s, key: .[1]}}}))
                   + [{name: "MOODLE_WWWROOT", value: "https://version-check.invalid"}, {name: "CACHE_HOST", value: "127.0.0.1"},
                      {name: "MOODLE_OUTBOUND", value: "off"}, {name: "MOODLE_INSTALL_ENABLED", value: "false"}],
              volumeMounts: [{name: "data", mountPath: "/var/www/moodledata"}, {name: "cache", mountPath: "/mnt/ramdisk"}],
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}}]}}')
          out=$(oc run "version-check-${GITHUB_RUN_ID}" -n "$NS" --rm -i --restart=Never --image="$image" \
                  --overrides="$overrides" --pod-running-timeout=5m 2>&1) || true
          echo "$out" | tail -5
          echo "$out" | grep -q 'No upgrade needed' \
            || { echo "::error::the database is not at the image's Moodle version (or could not be read): refusing (S7)"; exit 1; }

      - name: Helm upgrade --install (no upgrade.php, ever)
        run: |
          mapfile -t args < /tmp/helm-args
          helm upgrade --install "$RELEASE" chart/psa-moodle -n "$NS" "${args[@]}" --wait --timeout 15m

      - name: Verify the profile
        run: |
          case "${{ inputs.profile }}" in
            fenced) ops/replatform/verify-fenced.sh "$NS" "$RELEASE" ;;
            precommit|commit)
              expect=$([ "${{ inputs.profile }}" = commit ] && echo off || echo on)
              pod=$(oc get pods -n "$NS" -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=php" \
                    --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
              oc exec -i -n "$NS" "$pod" -c php -- sh -c 'cat > /tmp/check-outbound-guard.php' < ops/replatform/check-outbound-guard.php
              oc exec -n "$NS" "$pod" -c php -- sh -c "cd /var/www/html && php /tmp/check-outbound-guard.php --expect=$expect" ;;
          esac

      - name: Summary
        if: always()
        run: |
          {
            echo "## deploy-950003: ${{ inputs.environment }}, profile ${{ inputs.profile }}"
            echo
            echo "- php \`${{ inputs.php_digest }}\`"
            echo "- web \`${{ inputs.web_digest }}\`"
            echo "- cron \`${{ inputs.cron_digest }}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
