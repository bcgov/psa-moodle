apiVersion: v1
kind: Service
metadata:
  name: {{ include "psa-moodle.fullname" . }}-web
  labels:
    {{- include "psa-moodle.componentLabels" (list . "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "psa-moodle.componentSelectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
