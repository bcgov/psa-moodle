{{- /*
Valkey (Redis) AUTH password. Valkey is Moodle's session + cache store; without
a password any pod that can reach :6379 can read or forge sessions. NetworkPolicy
already restricts that reach to php/cron, but requirepass adds defense-in-depth —
this closes the BC-Gov-alignment "Valkey runs with no authentication" gap.

Generated once and preserved across upgrades via the lookup trick, so the
password stays stable (php/cron and the server never disagree on it).
*/ -}}
{{- $secretName := include "psa-moodle.valkey.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $pass := "" -}}
{{- if $existing -}}
{{- $pass = index $existing.data "VALKEY_PASSWORD" | b64dec -}}
{{- else -}}
{{- $pass = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "psa-moodle.componentLabels" (list . "valkey") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # keep the password stable across re-installs
type: Opaque
stringData:
  VALKEY_PASSWORD: {{ $pass | quote }}
