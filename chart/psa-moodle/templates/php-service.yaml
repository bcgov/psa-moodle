apiVersion: v1
kind: Service
metadata:
  name: {{ include "psa-moodle.fullname" . }}-php
  labels:
    {{- include "psa-moodle.componentLabels" (list . "php") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "psa-moodle.componentSelectorLabels" (list . "php") | nindent 4 }}
  ports:
    - name: fpm
      port: {{ .Values.php.service.port }}
      targetPort: fpm
      protocol: TCP
    {{- if include "psa-moodle.phpFpmExporter" . }}
    - name: metrics
      port: 9253
      targetPort: metrics
      protocol: TCP
    {{- end }}
# C1: there is no longer a Service literally named "php". Legacy moodle-nginx already has one in every 950003
# namespace; nginx now reaches this release's own Service through PHP_UPSTREAM (web-deployment.yaml).
