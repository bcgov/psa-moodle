{{- /*
Valkey config. Mirrors config/valkey/valkey.conf used in local dev, but with
memory cap and persistence taken from values.yaml so dev/test can be sized
independently.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "psa-moodle.valkey.fullname" . }}
  labels:
    {{- include "psa-moodle.componentLabels" (list . "valkey") | nindent 4 }}
data:
  valkey.conf: |
    bind 0.0.0.0 -::*
    protected-mode no
    port 6379

    # Lightweight RDB only — Moodle uses Valkey for sessions + cache; in-flight
    # loss on restart is acceptable.
    {{- if .Values.valkey.persistence.enabled }}
    save 60 1000
    {{- else }}
    save ""
    {{- end }}
    appendonly no
    dir /data

    maxmemory {{ .Values.valkey.maxmemory }}
    maxmemory-policy allkeys-lru
    # Moodle purges a cache definition with DEL on one hash; free it in the background so a large purge can't block
    # other requests past Moodle's 1 s timeout (self-review V1313).
    lazyfree-lazy-user-del yes

    loglevel notice
    logfile ""
