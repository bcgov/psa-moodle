{{- /*
Moodle admin credentials, consumed only by the post-install hook Job.
Generated once on first install; preserved across upgrades via the lookup
trick. Rotate manually after install if desired.

DB credentials live in a separate Secret managed by the Crunchy operator
("<cluster>-pguser-<user>") — never duplicated here.
*/ -}}
{{- $secretName := printf "%s-admin" (include "psa-moodle.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $adminPass := "" -}}
{{- if $existing -}}
{{- $adminPass = index $existing.data "MOODLE_ADMIN_PASS" | b64dec -}}
{{- else -}}
{{- $adminPass = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete on `helm uninstall`
type: Opaque
stringData:
  MOODLE_ADMIN_USER: {{ .Values.moodle.admin.user | quote }}
  MOODLE_ADMIN_EMAIL: {{ .Values.moodle.admin.email | quote }}
  MOODLE_ADMIN_PASS: {{ $adminPass | quote }}
