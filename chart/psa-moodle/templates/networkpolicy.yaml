{{- /*
NetworkPolicy: default-deny + explicit allowlist for the psa-moodle release.

These policies apply only to pods matching app.kubernetes.io/instance:
<release> so they do NOT affect the coexisting moodle-nginx workloads in the
same namespace (which carry app=moodle, not app.kubernetes.io/instance).

Egress (C9, C15, review V1003): default-deny + DNS, in-cluster allows (web→php, app→valkey, app/ops→postgres), then
by component: php and cron get internet HTTPS only with networkPolicy.externalEgress=on, and SMTP only when
moodle.outbound is also on; ops jobs always get the Kubernetes API (6443) and SMTP for alerts; web and install never
get anything external. Check a render with ops/replatform/egress-matrix.sh. Per-FQDN restriction would need an
OpenShift EgressFirewall on top (docs/phase4-hardening.md).
*/ -}}
{{- if .Values.networkPolicy.enabled }}
---
# Default-deny for all psa-moodle pods (ingress only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-deny-by-default
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psa-moodle.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  # No ingress rules = deny all ingress for matching pods.
---
# OpenShift router → web (HTTP 8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-router-to-web
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psa-moodle.componentSelectorLabels" (list . "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.web.service.port }}
---
# web → php (FastCGI 9000).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-web-to-php
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psa-moodle.componentSelectorLabels" (list . "php") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "psa-moodle.componentSelectorLabels" (list . "web") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.php.service.port }}
---
# php + cron + install → Valkey (6379).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-app-to-valkey
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psa-moodle.componentSelectorLabels" (list . "valkey") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
              - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
              - { key: app.kubernetes.io/component, operator: In, values: [php, cron, install] }
      ports:
        - protocol: TCP
          port: 6379
---
# php + cron + install → Postgres (5432). The Crunchy operator labels its
# instance pods with postgres-operator.crunchydata.com/cluster=<clusterName>.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-app-to-postgres
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: {{ include "psa-moodle.postgres.clusterName" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
              - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
              - { key: app.kubernetes.io/component, operator: In, values: [php, cron, install, backup-integrity, moodledata-backup] }
      ports:
        - protocol: TCP
          port: 5432
{{- if .Values.networkPolicy.egress.enabled }}
---
# Default-deny EGRESS for all psa-moodle pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-deny-egress-by-default
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psa-moodle.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  # No egress rules = deny all egress for matching pods.
---
# DNS egress (mandatory — everything fails without name resolution).
#
# CRITICAL Silver/OVN-Kubernetes gotcha: the cluster DNS Service (dns-default)
# maps port 53 -> targetPort 5353 (CoreDNS runs unprivileged on 5353). OVN
# evaluates egress ACLs AFTER the service DNAT, so the real destination port is
# 5353, NOT 53. An egress rule allowing only port 53 therefore NEVER matches the
# DNS query and silently breaks ALL resolution — this is why the previously
# documented fixes (port-53-to-anywhere, and a namespaceSelector to openshift-dns
# on port 53) both failed on Silver. Allowing 5353 is what actually works;
# 53 is kept for external/non-DNAT'd resolvers and cross-cluster portability.
# Verified empirically against an isolated probe pod in a58ce1-dev (2026-06).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-dns-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psa-moodle.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    # No `to:` — matches all destinations. 5353 is the post-DNAT CoreDNS port on
    # OpenShift OVN (the dns-default Service's targetPort); 53 covers everything else.
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
        - { protocol: UDP, port: 5353 }
        - { protocol: TCP, port: 5353 }
---
# web → php (FastCGI 9000) — egress side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-web-to-php-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psa-moodle.componentSelectorLabels" (list . "web") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "psa-moodle.componentSelectorLabels" (list . "php") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.php.service.port }}
---
# php + cron + install → Valkey (6379) — egress side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-app-to-valkey-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [php, cron, install] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "psa-moodle.componentSelectorLabels" (list . "valkey") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
---
# php + cron + install + backup ops → Postgres (5432) — egress side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-app-to-postgres-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [php, cron, install, backup-integrity, moodledata-backup] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: {{ include "psa-moodle.postgres.clusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
{{- $ext := include "psa-moodle.externalEgress" . }}
{{- if eq $ext "on" }}
---
# C15: the APPLICATION's internet egress, php and cron only, and only with networkPolicy.externalEgress=on (from the
# S11 commit point): the OAuth 2 IdP's server-side calls and the ELM/CData endpoints. Web and install never get it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-app-https-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [php, cron] }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.externalHttpsCidr | quote }}
      ports:
        - protocol: TCP
          port: 443
{{- if eq (include "psa-moodle.outbound" .) "on" }}
---
# C9: Moodle's own mail (php and cron) to the SMTP relay, only when both moodle.outbound and externalEgress are on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-app-smtp-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [php, cron] }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.externalSmtpCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.backup.alerts.smtpPort }}
{{- end }}
{{- end }}
---
# C15: ops jobs' Kubernetes API access, in every profile (the backup's `oc exec` into the repo host, the integrity check,
# the restore rehearsal). On OpenShift OVN, egress policy is evaluated after the kubernetes Service's DNAT, so the
# destination is expected to be the API servers on 6443; 443 is allowed too until Pass A shows which one is used. Then
# drop the unused port and narrow kubeApiCidr to the API servers' addresses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-ops-kube-api-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [moodledata-backup, backup-integrity, restore-rehearsal, moodledata-snapshot, moodledata-snapshot-prune] }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.kubeApiCidr | quote }}
      ports:
        {{- range .Values.networkPolicy.egress.kubeApiPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
---
# C15: ops alert delivery (alert.sh) to the SMTP relay, in every profile, so a failure before the commit point still
# reaches the owner. Application pods are not selected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psa-moodle.fullname" . }}-allow-ops-smtp-egress
  labels:
    {{- include "psa-moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ include "psa-moodle.name" . }}] }
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [moodledata-backup, backup-integrity, restore-rehearsal, moodledata-snapshot, moodledata-snapshot-prune] }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.externalSmtpCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.backup.alerts.smtpPort }}
{{- end }}
{{- end }}
