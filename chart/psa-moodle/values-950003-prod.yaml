# 950003-prod: psa-moodle beside legacy moodle-nginx during the replatform (runbook C6). Apply on top of values.yaml.
# Sizes: runbook §5.4. Never commit reviewer IP addresses or alert recipients: pass them at deploy time, e.g.
#   --set-json 'route.allowedSources=["<owner's address>/32"]' --set backup.alerts.to=<owner's email>
# Image home for 950003 (owner decision 2026-11-26): Artifactory project m950-learning, which legacy already pushes to
# and whose pull secret is in all three namespaces. Everything by digest (C13): php, web and cron from build-exact, ops
# too; deploy-950003 supplies all four. Docker Hub images come through the same project, pinned by digest (the image
# scan covers them; Dependabot can't see images named in values). Public images come through Artifactory's Docker Hub cache,
# docker-remote; m950-learning is a local repository and doesn't proxy (Pass A, 2026-11-26).
image:
  repository: m950-learning/psa-moodle
  pullSecret: artifactory-m950-learning
  ops: { name: ops, digest: "" }
monitoring:
  phpFpmExporter:
    # Off: hipages/php-fpm_exporter 2.2.0 is the newest release, unmaintained, and carries 5 CRITICAL and 68 HIGH fixable
    # vulnerabilities (Trivy, 2026-11-26). Turn on only with a maintained exporter, pinned by digest.
    enabled: false

install:
  enabled: false             # a migrated site: no installer, nokeygeneration (C2, V602)

migration:
  state: normal              # "fenced" for every upgrade during a writer fence (S13, V501)

moodle:
  wwwroot: "https://psa-moodle-950003-prod.apps.silver.devops.gov.bc.ca"   # temporary hostname until §13.2
  outbound: "off"            # "on" only by the S11 commit-point upgrade (C5)
  reviewerAdmins: "69"               # the owner (G2); the same id in prod and test

route:
  host: "psa-moodle-950003-prod.apps.silver.devops.gov.bc.ca"
  allowedSources: []         # admits nobody until addresses are passed at deploy time (S15, V505)

cron:
  enabled: false             # 0 until the commit point (C3, S4, S11)
  # Room for PHP's 2048M per request (legacy's cron has no memory limit; self-review V1303). Requests count against
  # quota, limits don't; 950003's memory quota is 32 GiB, about 5.6 used.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { memory: 3Gi }

web:
  replicas: 3
  image: { name: web, digest: "" }   # built from the exact php image (C10, C13)
php:
  image: { name: php, digest: "" }   # set to the exact-code prod build (.04) by digest before install (C10, C13)
  replicas: 3
  # Legacy's php pods have no memory limit and run 50 workers. 20 workers at up to 2048M each plus a 256 MB opcache
  # can't fit 1 GiB, so a busy or heavy pod would be killed with every request on it (self-review V1303). Start at
  # these; Pass B-HA's load test measures worker memory and sets the final figures and pm.max_children.
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits:   { memory: 3Gi }

hpa:                         # fixed replicas in every migration state (RB04)
  web: { enabled: false }
  php: { enabled: false }

moodledata:
  size: 6Gi

valkey:
  image:
    repository: artifacts.developer.gov.bc.ca/docker-remote/valkey/valkey   # Artifactory's Docker Hub cache (m950-learning is local only)
    tag: 7.2.16-alpine
    digest: sha256:3056ae42eccb4cf4ef5e5a403a68f6dbd8038774456086c152961bb79a467c6d
  # Moodle's application cache only (§0.11): no persistence, no volume. Changing this on a deployed release needs the
  # StatefulSet recreated (its volumeClaimTemplates can't change in place); Pass B starts from a fresh install.
  persistence:
    enabled: false
    size: 1Gi

postgres:
  instances:
    replicas: 3
    storage: 5Gi
  pgbackrest:
    repoStorage: 8Gi           # C8 moves it to netapp-file-backup with time-based retention (not yet in the chart)
    repoStorageClassName: netapp-file-backup
    retentionFull: 8               # days of point-in-time recovery (C8, J4)
    retentionFullType: time
    fullSchedule: "0 1 * * 0"      # weekly full, daily differential, hourly incremental
    differentialSchedule: "0 1 * * 1-6"
    incrementalSchedule: "15 * * * *"  # :15, so it never shares a minute with the 01:00 full/differential (pgBackRest lock, Pass B run 2) or the 02:30 moodledata pause

backup:
  integrity:
    maxFullBackupAgeHours: 192   # weekly fulls plus a day (review correction; daily and hourly cadence checked too)
  restoreRehearsal:
    enabled: false           # never in test or prod during the parallel run (G3, C7)
  moodledataSnapshot:
    enabled: false           # VolumeSnapshots don't suit file storage (C16); the C8 nightly backup replaces it
  moodledata:
    enabled: true           # provisioned from the first install (V1004): role, volume, grants
    suspended: true          # scheduled only from the S11 commit point (deploy-950003 commit profile; C8, J1)
    knownGapsConfigMap: psa-moodle-known-gaps   # known-gaps.txt: the cutover's known-missing hashes, created at §13.2, never in git
    size: 10Gi

# C15: the ops jobs' Kubernetes API rule, narrowed after Pass A. In-cluster clients reach the API through the kubernetes
# Service (172.30.0.1:443), which OVN translates to the control-plane nodes on 6443 before policy applies.
# 142.34.194.119 is api.silver's external address, which in-cluster clients never use, so it is not the target. The
# control-plane addresses can't be read with namespace access; the cluster's nodes and api-int (142.34.151.251) are in
# 142.34.151.0/24. Proved in 950003-dev 2026-11-26 (integrity check and moodledata backup through this rule; runbook §0.9).
networkPolicy:
  egress:
    kubeApiCidr: "142.34.151.0/24"
    kubeApiPorts: [6443]
