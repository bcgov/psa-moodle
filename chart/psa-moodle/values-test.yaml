# Overrides for the TEST environment.
#
# TEST IS PRODUCTION-GRADE. Course developers and instructional designers build
# courses there (README, "Environment roles"). Ship to test only with a fresh
# verified backup, an agreed window and a rollback. Load tests, restore drills
# and failover experiments run in dev, never here.
#
# Production-shaped topology, per the 2026-04-12 restore assessment's point about
# prod-only failures emerging with multi-pod request flow.

moodle:
  wwwroot: "https://psa-moodle-test.apps.silver.devops.gov.bc.ca"

route:
  host: "psa-moodle-test.apps.silver.devops.gov.bc.ca"

# Production-shaped replicas: minimum 3 per BC Gov HA guidelines.
web:
  replicas: 3
php:
  replicas: 3

# Phase 4 hardening: exercise the autoscale path in test so it's not first-touch
# in prod. Bounds chosen to fit a single-node-failure scenario without blowing
# the namespace ResourceQuota.
hpa:
  web:
    enabled: true
    minReplicas: 3
    maxReplicas: 5
  php:
    enabled: true
    minReplicas: 3
    maxReplicas: 6

postgres:
  instances:
    replicas: 3

moodledata:
  size: 20Gi

monitoring:
  alerts:
    to: "Allan.Haggett@gov.bc.ca"

backup:
  alerts:
    to: "Allan.Haggett@gov.bc.ca"
  # The weekly restore-rehearsal CronJob runs here as routine verification, as in
  # prod: it restores into a temporary cluster and never touches the live one.
  # Deliberate-corruption tests of the alerts run in dev only.
  # See values.yaml — moodledata snapshots can't run on the RWX/NFS volume; keep
  # snapshotClass empty. moodledata off-site backup is the tracked prod item.
  moodledataSnapshot:
    snapshotClass: ""
    retentionDays: 14
